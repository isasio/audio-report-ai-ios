name: Bug report
description: Report a problem with the iOS app
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include patient data, recordings, transcripts, reports, Apple ID
        credentials, signing certificates, or other sensitive information.

        Include the app version, iOS version, device model, and the exact steps
        that reproduce the problem. Screenshots should use synthetic data only.
  - type: input
    id: version
    attributes:
      label: App version and build
      placeholder: "0.1.0 (123)"
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS version and device
      placeholder: "iOS 18.1, iPhone 16e"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Create a session
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included patient data, recordings, transcripts, reports, or signing credentials.
          required: true
